<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Consultar Packing List
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">
        Consultar registro
    </h2>


    <!-- CAMPO PARA LECTOR -->

    <div class="input-group mb-4">

        <input
            type="text"
            id="codigoBarras"
            class="form-control form-control-lg"
            placeholder="Escanee el código..."
            autofocus
        >

        <button
            type="button"
            id="btnBuscar"
            class="btn btn-primary"
        >
            Buscar
        </button>

    </div>


    <!-- RESULTADO -->

    <div
        id="resultado"
        style="display:none;"
    >

        <div class="card">

            <div class="card-header bg-primary text-white">

                <strong>
                    Información del registro
                </strong>

            </div>


            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">
                        <strong>ID:</strong>
                        <span id="r_id"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Envío:</strong>
                        <span id="r_envio"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Status:</strong>
                        <span id="r_status"></span>
                    </div>

                </div>

                <hr>


                <div class="row">

                    <div class="col-md-4">
                        <strong>Código lote:</strong>
                        <span id="r_codigo_lote"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Fecha:</strong>
                        <span id="r_fecha"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Cultivo:</strong>
                        <span id="r_cultivo"></span>
                    </div>

                </div>

                <hr>


                <div class="row">

                    <div class="col-md-4">
                        <strong>Variedad:</strong>
                        <span id="r_variedad"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Apodo:</strong>
                        <span id="r_apodo"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Harvest Code:</strong>
                        <span id="r_harvest"></span>
                    </div>

                </div>

                <hr>


                <div class="row">

                    <div class="col-md-4">
                        <strong>Bolsa:</strong>
                        <span id="r_bolsa"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Caja:</strong>
                        <span id="r_caja"></span>
                    </div>

                    <div class="col-md-4">
                        <strong>Ubicación:</strong>
                        <span id="r_ubicacion"></span>
                    </div>

                </div>

                <hr>


                <div class="row">

                    <div class="col-md-4">
                        <strong>Net Weight:</strong>
                        <span id="r_net"></span> KG
                    </div>

                    <div class="col-md-4">
                        <strong>Gross Weight:</strong>
                        <span id="r_gross"></span> KG
                    </div>

                    <div class="col-md-4">
                        <strong>Género:</strong>
                        <span id="r_genero"></span>
                    </div>

                </div>


                <div class="mt-3">

                    <strong>
                        Observaciones:
                    </strong>

                    <div id="r_observaciones"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="alert alert-danger"
        style="display:none;"
    ></div>

</div>


<script>

const input =
    document.getElementById('codigoBarras');


const btn =
    document.getElementById('btnBuscar');


function buscarRegistro() {

    const codigo =
        input.value.trim();


    if (!codigo) {

        return;

    }


    fetch(
        "{% url 'packinglist_consultar' %}?id=" +
        encodeURIComponent(codigo)
    )

    .then(response => response.json())

    .then(data => {

        if (!data.success) {

            document.getElementById(
                'resultado'
            ).style.display = 'none';


            const error =
                document.getElementById('error');


            error.innerText =
                data.message;


            error.style.display =
                'block';


            return;
        }


        document.getElementById(
            'error'
        ).style.display = 'none';


        const r =
            data.registro;


        document.getElementById(
            'r_id'
        ).innerText = r.id;


        document.getElementById(
            'r_envio'
        ).innerText =
            r.envio || 'Sin envío';


        document.getElementById(
            'r_status'
        ).innerText =
            r.status || '';


        document.getElementById(
            'r_codigo_lote'
        ).innerText =
            r.codigo_lote || '';


        document.getElementById(
            'r_fecha'
        ).innerText =
            r.fecha || '';


        document.getElementById(
            'r_cultivo'
        ).innerText =
            r.cultivo || '';


        document.getElementById(
            'r_variedad'
        ).innerText =
            r.variedad_code || '';


        document.getElementById(
            'r_apodo'
        ).innerText =
            r.apodo_variedad || '';


        document.getElementById(
            'r_harvest'
        ).innerText =
            r.harvest_code || '';


        document.getElementById(
            'r_bolsa'
        ).innerText =
            r.bolsa || '';


        document.getElementById(
            'r_caja'
        ).innerText =
            r.caja || '';


        document.getElementById(
            'r_ubicacion'
        ).innerText =
            r.ubicacion || '';


        document.getElementById(
            'r_net'
        ).innerText =
            r.net_weight || '';


        document.getElementById(
            'r_gross'
        ).innerText =
            r.gross_weight || '';


        document.getElementById(
            'r_genero'
        ).innerText =
            r.genero || '';


        document.getElementById(
            'r_observaciones'
        ).innerText =
            r.observaciones || '';


        document.getElementById(
            'resultado'
        ).style.display =
            'block';


        // Preparar para siguiente escaneo

        input.value = '';

        input.focus();

    })

    .catch(error => {

        console.error(error);

        const errorBox =
            document.getElementById('error');


        errorBox.innerText =
            'No fue posible consultar el registro.';


        errorBox.style.display =
            'block';

    });

}


btn.addEventListener(
    'click',
    buscarRegistro
);


input.addEventListener(
    'keydown',
    function(event) {

        if (
            event.key === 'Enter'
        ) {

            event.preventDefault();

            buscarRegistro();

        }

    }
);


window.addEventListener(
    'load',
    function() {

        input.focus();

    }
);

</script>

</body>

</html>
