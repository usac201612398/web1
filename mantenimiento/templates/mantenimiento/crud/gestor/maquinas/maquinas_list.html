<!DOCTYPE html>

<html lang="es">

{% load static %}

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Máquinas</title>


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >


    <link
        rel="stylesheet"
        href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"
    >


    <style>

        body {
            background: #f8fafc;
        }


        .page-header-box {

            background: linear-gradient(
                to right,
                #6c757d,
                #495057
            );

            border-radius: 8px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.1);
        }


        .page-header-box h1 {

            font-size: 1.8rem;

            font-weight: bold;

            margin: 0;
        }


        .table-custom-header th {

            background: linear-gradient(
                to right,
                #6c757d,
                #495057
            );

            color: white;

            font-weight: 600;

            text-align: center;

            border-bottom: 2px solid #dee2e6;

            white-space: nowrap;
        }


        @media (max-width: 768px) {

            th,
            td {

                font-size: 13px;
            }


            .btn {

                font-size: 13px;
            }


            .table-responsive {

                overflow-x: auto;

                -webkit-overflow-scrolling: touch;
            }


            table.dataTable {

                width: 100% !important;
            }


            .dataTables_wrapper {

                overflow-x: auto;
            }


            .table td,
            .table th {

                white-space: nowrap;
            }


            .page-header-box h1 {

                font-size: 1.4rem;
            }

        }

    </style>

</head>


<body>


<div class="container py-3">


    <!-- ENCABEZADO -->

    <div
        class="page-header-box text-white text-center py-3 mb-4"
    >

        <h1>

            Administrar - Máquinas

        </h1>

    </div>


    <!-- BOTONES -->

    <div
        class="d-flex justify-content-between flex-wrap mb-3"
    >


        <a
            href="{% url 'maquinas_create' %}"
            class="btn btn-outline-secondary"
        >

            <i class="fas fa-plus"></i>

            Agregar

        </a>


        <a
            href="{% url 'exportar_excel_generico' 'Maquina' %}"
            class="btn btn-outline-secondary"
        >

            <i class="fas fa-file-excel"></i>

            Exportar

        </a>

    </div>


    <!-- TABLA -->

    <div class="table-responsive">

        <table
            class="table table-striped table-bordered"
            id="myTable"
        >

            <thead class="table-custom-header">

                <tr>

                    <th>Id</th>

                    <th>Nombre</th>

                    <th>Tipo</th>

                    <th>Status</th>

                    <th>Editar</th>

                    <th>Anular</th>

                </tr>

            </thead>


            <tbody>

                {% for registro in registros %}

                <tr>

                    <td>
                        {{ registro.registro }}
                    </td>


                    <td>
                        {{ registro.nombre }}
                    </td>


                    <td>
                        {{ registro.tipo }}
                    </td>


                    <td>
                        {{ registro.status }}
                    </td>


                    <td class="text-center">

                        <a
                            href="{% url 'maquinas_update' registro.pk %}"
                            class="text-warning"
                            title="Editar"
                        >

                            <i class="fas fa-edit"></i>

                        </a>

                    </td>


                    <td class="text-center">

                        <a
                            href="{% url 'maquinas_delete' registro.pk %}"
                            class="text-danger"
                            title="Anular"
                        >

                            <i class="fas fa-ban"></i>

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>


    <!-- HOME -->

    <div class="text-center mt-4">

        <a
            href="{% url 'tablero' %}"
            class="btn btn-secondary"
        >

            <i class="fas fa-home"></i>

            Home

        </a>

    </div>


</div>


<script
    src="https://code.jquery.com/jquery-3.6.0.min.js">
</script>


<script
    src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js">
</script>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    $(document).ready(function () {

        var table = $('#myTable').DataTable({

            responsive: true,

            autoWidth: false,

            language: {

                url:
                "//cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json"

            }

        });


        $('#myTable').on('init.dt', function () {

            table.columns.adjust();

        });

    });

</script>


</body>

</html>
