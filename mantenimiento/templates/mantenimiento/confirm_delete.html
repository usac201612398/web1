{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}
<h1>Confirmar eliminación</h1>
<div class="card">
  <p>¿Seguro que deseas eliminar <b>{{ object }}</b>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn danger" type="submit">Sí, eliminar</button>
    <a class="btn sec" href="javascript:history.back()">Cancelar</a>
  </form>
</div>
{% endblock %}
